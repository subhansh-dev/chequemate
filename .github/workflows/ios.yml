name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version and schemes
        run: |
          xcodebuild -version
          cd download/huewaves.swiftpm
          xcodebuild -list

      - name: Build for iOS Simulator
        run: |
          cd download/huewaves.swiftpm
          xcodebuild build \
            -scheme Huewaves \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1
